# Local development stack: app + background worker + Postgres with pgvector.
# Uses the offline chatbot and console email so nothing leaves your machine.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hoa
      POSTGRES_PASSWORD: hoa
      POSTGRES_DB: hoa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoa"]
      interval: 2s
      retries: 20

  app: &app
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://hoa:hoa@db:5432/hoa
      LOCAL_STORAGE_DIR: /data/documents
      EMAIL_SEND_INLINE: "false"
    volumes: [documents:/data/documents]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    <<: *app
    ports: []
    command: python -m app.worker

volumes:
  pgdata:
  documents:
