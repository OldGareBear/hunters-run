{% extends "_layout.html" %}
{% block body %}
<p>Someone asked to reset the password for your {{ hoa_name }} portal account.</p>
<p><a href="{{ link }}" style="display:inline-block;background:#1f5f99;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none">Choose a new password</a></p>
<p style="font-size:13px;color:#5b6475">The link works once and expires in {{ ttl_minutes }} minutes. If it wasn't you, ignore this email; your password stays the same.</p>
{% endblock %}
