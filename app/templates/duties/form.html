{% extends "base.html" %}
{% block title %}{{ "Edit duty" if duty else "Add a duty" }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ "Edit duty" if duty else "Add a duty" }}</h1>
  {% include "_errors.html" %}
  <form method="post" action="{{ '/duties/%d' % duty.id if duty else '/duties' }}">
    {{ csrf_input(request) }}
    <label>Title <input name="title" maxlength="200" value="{{ v.title or '' }}" required></label>
    <label>Details <textarea name="details" rows="3" maxlength="5000">{{ v.details or '' }}</textarea></label>
    <label>Usually done by (optional) <input name="owners" value="{{ v.owners or '' }}" placeholder="board; treasurer@example.org">
      <span class="muted small">Email addresses of board or management members, board or management, separated by semicolons. The weekly review uses this as a hint when it works out who should act; leave it blank and it decides.</span></label>
    <div class="row">
      <label>First due date <input type="date" name="first_due" value="{{ v.first_due or '' }}" required></label>
      <label>Repeats <select name="repeat">{% for r in repeats %}<option value="{{ r }}" {% if (v.repeat or 'none') == r %}selected{% endif %}>{{ r | capitalize }}</option>{% endfor %}</select></label>
    </div>
    <label class="check"><input type="checkbox" name="hard_deadline" value="yes" {% if v.hard_deadline %}checked{% endif %}> Hard deadline
      <span class="muted small">Always in the weekly review from three weeks out. Other duties are always in it the week before they're due, and earlier only when it's worth acting on now.</span></label>
    <button class="primary">Save</button> <a href="/duties">Cancel</a>
  </form>
</section>
{% endblock %}
