[project]
name = "hoa-portal"
version = "0.1.0"
description = "Invite-only HOA portal: role-based document library, a permission-aware document chatbot, board email blasts and escalation to management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.4",
    "anthropic>=2.10",
    "voyageai>=0.3",
    "boto3>=1.34",
    "cryptography>=43",
    "pypdf>=5",
    "python-docx>=1.1",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
lambda = [
    "mangum>=0.19",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mangum>=0.19",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/cli.py" = ["S105", "S106"]
